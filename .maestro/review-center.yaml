appId: com.riccardopinato.omnicleaner.debug
---
# Non-destructive, direct Home -> cross-module review -> gallery.
- launchApp:
    clearState: false
- scrollUntilVisible:
    element:
      id: "omni_bento_v2_review"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "omni_bento_v2_review"
- assertVisible:
    id: "omni_review_center"
- scrollUntilVisible:
    element:
      id: "omni_review_open_gallery"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "omni_review_open_gallery"
- assertVisible: "Full-screen review"
- pressKey: Back
- assertVisible:
    id: "omni_bento_v2_editor_toggle"
