appId: com.riccardopinato.omnicleaner.debug
---
# Dedicated screen hierarchy; no destructive request is authorized here.
- launchApp:
    clearState: false
- assertVisible: "Android Omni Cleaner"
- assertVisible: "Smart cleaning"
- assertVisible: "Analyze storage"
- tapOn: "Settings"
- assertVisible: "Appearance"
- pressKey: Back
- tapOn:
    id: "omni_nav_clean"
- assertVisible: "Deep Cleaning"
- tapOn:
    id: "omni_clean_tool_duplicates"
- assertVisible: "Find duplicates"
- pressKey: Back
- tapOn:
    id: "omni_nav_gallery"
- assertVisible: "Gallery cleaner"
- tapOn:
    id: "omni_nav_privacy"
- assertVisible: "EXIF privacy"
- tapOn:
    id: "omni_privacy_quick"
- assertVisible: "Choose one JPEG photo"
- pressKey: Back
- tapOn:
    id: "omni_privacy_batch"
- assertVisible: "Choose photo folder"
- pressKey: Back
- tapOn:
    id: "omni_nav_pro"
- assertVisible: "Omni Cleaner Pro"
- tapOn:
    id: "omni_pro_manage"
- assertVisible: "Restore purchase"
- pressKey: Back
- tapOn:
    id: "omni_nav_home"
- assertVisible: "Smart cleaning"
