appId: com.riccardopinato.omnicleaner.debug
---
# AUD-0014 / AUD-0016: non-destructive navigation and visible state contract.
# This is emulator smoke evidence, never a physical-device/store certification.
- launchApp:
    clearState: false
- assertVisible: "Android Omni Cleaner"
- assertVisible: "Smart cleaning"
- assertVisible: "Analyze storage"

# Settings moved from Pro to Home in AUD-0010; verify current location.
- tapOn: "Settings"
- assertVisible: "Appearance"
- scrollUntilVisible:
    element:
      text: "App language"
    direction: DOWN
    timeout: 30000
- assertVisible: "App language"
- pressKey: Back

- tapOn: "Clean"
- assertVisible: "Deep Cleaning"
- tapOn: "Gallery"
- assertVisible: "Gallery cleaner"
- tapOn: "Privacy"
- assertVisible: "EXIF privacy"
- assertVisible: "Choose one JPEG photo"
- tapOn: "Advanced EXIF options"
- assertVisible: "Choose photo folder"
- tapOn: "Pro"
- assertVisible: "Omni Cleaner Pro"
- tapOn: "Home"
- assertVisible: "Smart cleaning"
