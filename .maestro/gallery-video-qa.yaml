appId: com.riccardopinato.omnicleaner.debug
---
- launchApp:
    clearState: false
# The hosted Pixel Launcher can independently ANR during cold startup.
# Dismiss only that system launcher dialog; never suppress an app crash.
- tapOn:
    text: "Close app"
    optional: true
- assertVisible: "Android Omni Cleaner"
- tapOn:
    text: "Gallery"
- assertVisible: "Gallery Cleaner"
- takeScreenshot: visual-evidence/gallery-filters
- tapOn:
    text: "Videos only"
- repeat:
    times: 3
    while:
      notVisible: "OmniQA-video.mp4"
    commands:
      - tapOn:
          text: "Load gallery"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "OmniQA-video.mp4"
    timeout: 20000
- assertVisible: "Keep"
- assertVisible: "Trash"
- takeScreenshot: visual-evidence/video-review
- tapOn:
    text: "Play video"
- assertVisible: "Close"
- takeScreenshot: visual-evidence/video-fullscreen
- tapOn:
    text: "Close"
- assertVisible: "Keep"
- assertVisible: "Trash"
- tapOn:
    text: "Photos only"
- repeat:
    times: 3
    while:
      notVisible: "OmniQA-portrait.jpg"
    commands:
      - tapOn:
          text: "Load gallery"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "OmniQA-portrait.jpg"
    timeout: 20000
- takeScreenshot: visual-evidence/photo-review
- tapOn:
    text: "Open photo"
- assertVisible: "Close"
- takeScreenshot: visual-evidence/photo-fullscreen
- tapOn:
    text: "Close"
- assertVisible: "Keep"
- assertVisible: "Trash"
