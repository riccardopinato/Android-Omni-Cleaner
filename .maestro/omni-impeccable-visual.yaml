appId: com.riccardopinato.omnicleaner.debug
---
- launchApp:
    clearState: true
- assertVisible: "Android Omni Cleaner"
- assertVisible: "Home"
- takeScreenshot: visual-evidence/home-light
- scrollUntilVisible:
    element:
      text: "Gallery cleaner"
    direction: DOWN
    timeout: 30000
- takeScreenshot: visual-evidence/home-actions
- tapOn:
    text: "Gallery"
- assertVisible: "Gallery Cleaner"
- takeScreenshot: visual-evidence/gallery
- tapOn:
    text: "Privacy"
- assertVisible: "EXIF Privacy"
- takeScreenshot: visual-evidence/privacy
- tapOn:
    text: "Clean"
- assertVisible: "Deep Cleaning"
- takeScreenshot: visual-evidence/clean
- tapOn:
    text: "Pro"
- assertVisible: "Omni Cleaner Pro"
- takeScreenshot: visual-evidence/pro
- tapOn:
    text: "Home"
- assertVisible: "Android Omni Cleaner"
