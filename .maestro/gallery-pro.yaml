appId: com.riccardopinato.omnicleaner.debug
---
# Read-only Gallery Pro verification, with no Trash action.
- launchApp:
    clearState: false
- scrollUntilVisible:
    element:
      id: "omni_bento_v2_galleryPro"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "omni_bento_v2_galleryPro"
- assertVisible: "Gallery Pro"
- assertVisible: "Video analysis"
- tapOn:
    id: "omni_gallery_pro_video_search"
- inputText: "mp4"
- pressKey: Back
- scrollUntilVisible:
    element:
      text: "Potentially similar photos"
    direction: DOWN
    timeout: 30000
- assertVisible: "Potentially similar photos"
