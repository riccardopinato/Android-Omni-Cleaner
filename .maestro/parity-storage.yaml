appId: com.riccardopinato.omnicleaner.debug
---
# Audit-era parity smoke. No destructive cleanup is authorized by this flow.
- launchApp:
    clearState: false
- tapOn: "Clean"
- assertVisible: "Deep Cleaning"
- assertVisible: "Scan tools"
- tapOn: "Analyze storage"
- scrollUntilVisible:
    element:
      text: "Storage overview"
    direction: DOWN
    timeout: 120000
    speed: 45
- assertVisible: "Storage overview"
- scrollUntilVisible:
    element:
      text: ".*Filters & thresholds.*"
    direction: UP
    timeout: 30000
- tapOn: ".*Filters & thresholds.*"
- scrollUntilVisible:
    element:
      text: "Search folders"
    direction: DOWN
    timeout: 30000
- assertVisible: "Search folders"
# Verify that review settings are retained during navigation (AUD-0016).
- tapOn: "Gallery"
- assertVisible: "Gallery cleaner"
- tapOn: "Clean"
- assertVisible: "Search folders"
