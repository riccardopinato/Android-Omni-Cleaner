appId: com.riccardopinato.omnicleaner.debug
---
# Single Home parity: direct scan, filter page, gallery, and return.
# Never approves an Android Trash or deletion request.
- launchApp:
    clearState: false
- assertVisible:
    id: "omni_bento_v2_storage"
- tapOn:
    id: "omni_bento_v2_storage"
- extendedWaitUntil:
    visible: "Open results"
    timeout: 120000
- tapOn:
    id: "omni_bento_v2_storage"
- assertVisible:
    id: "omni_clean_detail_overview"
- pressKey: Back
- assertVisible:
    id: "omni_bento_v2_editor_toggle"
- scrollUntilVisible:
    element:
      id: "omni_bento_v2_filters"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "omni_bento_v2_filters"
- assertVisible:
    id: "omni_clean_detail_filters"
- pressKey: Back
- assertVisible:
    id: "omni_bento_v2_editor_toggle"
- scrollUntilVisible:
    element:
      id: "omni_bento_v2_gallery"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "omni_bento_v2_gallery"
- assertVisible: "Gallery cleaner"
- pressKey: Back
- assertVisible:
    id: "omni_bento_v2_editor_toggle"
- assertVisible:
    id: "omni_bento_v2_storage"
