appId: com.riccardopinato.omnicleaner.debug
---
# Hub -> dedicated tool -> scan -> filters -> another tab -> return.
# Deliberately non-destructive; never confirms any Trash request.
- launchApp:
    clearState: false
- tapOn:
    id: "omni_nav_clean"
- assertVisible: "Deep Cleaning"
- assertVisible: "Scan tools"
- tapOn:
    id: "omni_clean_tool_overview"
- assertVisible: "Analyze storage"
- tapOn:
    id: "omni_scan_overview"
- scrollUntilVisible:
    element:
      text: "Storage overview"
    direction: DOWN
    timeout: 120000
    speed: 45
- assertVisible: "Storage overview"
- pressKey: Back
- tapOn:
    id: "omni_clean_tool_filters"
- scrollUntilVisible:
    element:
      text: "Search folders"
    direction: DOWN
    timeout: 30000
- assertVisible: "Search folders"
# Domain scan state survives as we navigate through a different top-level tab.
- pressKey: Back
- tapOn:
    id: "omni_nav_gallery"
- assertVisible: "Gallery cleaner"
- tapOn:
    id: "omni_nav_clean"
- tapOn:
    id: "omni_clean_tool_overview"
- assertVisible: "Storage overview"
