appId: com.riccardopinato.omnicleaner.debug
---
# After force-stop, verify the single Home and direct dedicated destinations.
# No file deletion, Android Trash authorization or media mutation.
- launchApp:
    clearState: false
- assertVisible:
    id: "omni_bento_v2_editor_toggle"
- scrollUntilVisible:
    element:
      id: "omni_bento_v2_review"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "omni_bento_v2_review"
- assertVisible:
    id: "omni_review_center"
- tapOn: "Find duplicates"
- assertVisible:
    id: "omni_clean_detail_duplicates"
- pressKey: Back
- assertVisible:
    id: "omni_bento_v2_editor_toggle"
- scrollUntilVisible:
    element:
      id: "omni_bento_v2_gallery"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "omni_bento_v2_gallery"
- assertVisible: "Gallery cleaner"
- pressKey: Back
- assertVisible:
    id: "omni_bento_v2_editor_toggle"
- scrollUntilVisible:
    element:
      id: "omni_bento_v2_privacy"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "omni_bento_v2_privacy"
- assertVisible: "Choose one JPEG photo"
- pressKey: Back
- assertVisible:
    id: "omni_bento_v2_editor_toggle"
