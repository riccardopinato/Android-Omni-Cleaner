appId: com.riccardopinato.omnicleaner.debug
---
# Settings/language controls were moved from Pro to Home in AUD-0010.
# Executed under 1.3x system font in AppLab script.
- launchApp:
    clearState: false
# Address the clickable NavigationBarItem, not its nested Text child.
# At larger font scales, a label-only tap may land in a non-clickable gap.
- tapOn:
    id: "omni_nav_home"
- assertVisible: "Smart cleaning"
# Verify repeated navigation with the exact same density before opening Settings.
- tapOn:
    id: "omni_nav_clean"
- assertVisible: "Deep Cleaning"
- tapOn:
    id: "omni_nav_home"
- assertVisible: "Smart cleaning"
- tapOn: "Settings"
- assertVisible: "Appearance"
- scrollUntilVisible:
    element:
      text: "App language"
    direction: DOWN
    timeout: 30000
- assertVisible: "English"
- assertVisible: "Italiano"
- tapOn: "Italiano"
- assertVisible: "Lingua dell’app"
- assertVisible: "Aspetto"
- tapOn: "English"
- assertVisible: "App language"
- assertVisible: "Appearance"
