appId: com.riccardopinato.omnicleaner.debug
---
# Single Home navigation under 1.3x font scale and locale switching.
- launchApp:
    clearState: false
- assertVisible:
    id: "omni_bento_v2_editor_toggle"
- scrollUntilVisible:
    element:
      id: "omni_bento_v2_review"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "omni_bento_v2_review"
- assertVisible:
    id: "omni_review_center"
- pressKey: Back
- assertVisible:
    id: "omni_bento_v2_editor_toggle"
- tapOn:
    id: "omni_home_settings"
- assertVisible: "Appearance"
- scrollUntilVisible:
    element:
      text: "App language"
    direction: DOWN
    timeout: 30000
- assertVisible: "English"
- assertVisible: "Italiano"
- tapOn: "Italiano"
- assertVisible: "Lingua dell’app"
- assertVisible: "Aspetto"
- tapOn: "English"
- assertVisible: "App language"
- assertVisible: "Appearance"
