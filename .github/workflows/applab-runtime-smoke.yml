name: AppLab Runtime Smoke

on:
  push:
    branches:
      - "recovery/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applab-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Android Omni Cleaner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: target
          persist-credentials: false

      - name: Checkout pinned AppLab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: riccardopinato/AppLab
          ref: d3681e4d2b92631ce96fcfc80349a079cbed40bb
          path: .applab
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: target
        run: ./gradlew assembleDebug --stacktrace

      - name: Install Maestro
        working-directory: .applab
        run: |
          chmod +x scripts/install_maestro.sh
          ./scripts/install_maestro.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare bounded AppLab plan
        run: |
          cat > "$RUNNER_TEMP/applab-fast-plan.json" <<'JSON'
          {
            "selected_labs": {
              "system": true,
              "performance": false,
              "network": false,
              "persistence": false,
              "configuration": false,
              "resource_pressure": false,
              "background": false,
              "storage": false,
              "upgrade": false
            }
          }
          JSON

      - name: Run AppLab emulator smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          APK_PATH: ${{ github.workspace }}/target/app/build/outputs/apk/debug/app-debug.apk
          PACKAGE_ID: com.riccardopinato.omnicleaner.debug
          APPLAB_PLAN: ${{ runner.temp }}/applab-fast-plan.json
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/target/.github/scripts/applab-runtime-smoke.sh"
      - name: Publish non-trusted runtime evidence
        if: always()
        shell: bash
        run: |
          echo "===== APPLAB NON_TRUSTED_RUNTIME_SMOKE ====="
          if [[ -s "$GITHUB_WORKSPACE/applab-runtime-smoke/summary.md" ]]; then
            cat "$GITHUB_WORKSPACE/applab-runtime-smoke/summary.md"
          fi
          if [[ -s "$GITHUB_WORKSPACE/applab-runtime-smoke/result.json" ]]; then
            cat "$GITHUB_WORKSPACE/applab-runtime-smoke/result.json"
          fi
          {
            echo "## AppLab Runtime Smoke"
            echo
            echo "**Authority:** NON_TRUSTED_SMOKE — useful runtime evidence, not certification."
            echo
            echo "**Target:** `$GITHUB_SHA`"
            echo
            if [[ -s "$GITHUB_WORKSPACE/applab-runtime-smoke/summary.md" ]]; then
              cat "$GITHUB_WORKSPACE/applab-runtime-smoke/summary.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
