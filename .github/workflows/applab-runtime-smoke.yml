name: AppLab Runtime Smoke

on:
  push:
    branches:
      - "recovery/**"
      - "audit/**"
      - "hardening/**"
      - "monetization/**"
      - "redesign/**"
      - "step-7-product-expansion"
      - "step-8-localization-accessibility"
      - "step-9-performance-deep-qa"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: applab-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout Android Omni Cleaner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: target
          persist-credentials: false

      - name: Checkout pinned AppLab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: riccardopinato/AppLab
          ref: 9050482675d928c35b428161c1183a4c9ffc87c7
          path: .applab
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: Build debug APK
        working-directory: target
        run: ./gradlew assembleDebug --stacktrace

      - name: Install Maestro
        working-directory: .applab
        run: |
          chmod +x scripts/install_maestro.sh
          ./scripts/install_maestro.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare bounded AppLab plan
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/step-9-performance-deep-qa" ]]; then
            cat > "$RUNNER_TEMP/applab-fast-plan.json" <<'JSON'
          {
            "selected_labs": {
              "system": true,
              "performance": true,
              "network": false,
              "persistence": true,
              "configuration": true,
              "resource_pressure": true,
              "background": true,
              "storage": true,
              "upgrade": false
            }
          }
          JSON
          else
            cat > "$RUNNER_TEMP/applab-fast-plan.json" <<'JSON'
          {
            "selected_labs": {
              "system": true,
              "performance": false,
              "network": false,
              "persistence": true,
              "configuration": false,
              "resource_pressure": false,
              "background": false,
              "storage": true,
              "upgrade": false
            }
          }
          JSON
          fi

      - name: Run AppLab emulator smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          APK_PATH: ${{ github.workspace }}/target/app/build/outputs/apk/debug/app-debug.apk
          PACKAGE_ID: com.riccardopinato.omnicleaner.debug
          APPLAB_PLAN: ${{ runner.temp }}/applab-fast-plan.json
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disk-size: 2048M
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/target/.github/scripts/applab-runtime-smoke.sh"
      - name: Publish non-trusted runtime evidence
        if: always()
        shell: bash
        run: |
          echo "===== APPLAB NON_TRUSTED_RUNTIME_SMOKE ====="
          if [[ -s "$GITHUB_WORKSPACE/applab-runtime-smoke/summary.md" ]]; then
            cat "$GITHUB_WORKSPACE/applab-runtime-smoke/summary.md"
          fi
          if [[ -s "$GITHUB_WORKSPACE/applab-runtime-smoke/result.json" ]]; then
            cat "$GITHUB_WORKSPACE/applab-runtime-smoke/result.json"
          fi
          if [[ -s "$GITHUB_WORKSPACE/applab-runtime-smoke/interaction-crawl.md" ]]; then
            echo "===== APPLAB INTERACTION CRAWL ====="
            cat "$GITHUB_WORKSPACE/applab-runtime-smoke/interaction-crawl.md"
          fi
          if [[ -s "$GITHUB_WORKSPACE/applab-runtime-smoke/interaction-crawl.json" ]]; then
            cat "$GITHUB_WORKSPACE/applab-runtime-smoke/interaction-crawl.json"
          fi
          {
            echo "## AppLab Runtime Smoke"
            echo
            echo "**Authority:** NON_TRUSTED_SMOKE — useful runtime evidence, not certification."
            echo
            echo "**Target:** $GITHUB_SHA"
            echo
            if [[ -s "$GITHUB_WORKSPACE/applab-runtime-smoke/summary.md" ]]; then
              cat "$GITHUB_WORKSPACE/applab-runtime-smoke/summary.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish exact parity APK prerelease
        if: success() && github.ref == 'refs/heads/audit/maxi-step-3-apk-parity'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          APK="$GITHUB_WORKSPACE/target/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="step3-parity-$SHORT_SHA"
          ASSET="Android-Omni-Cleaner-Step3-$SHORT_SHA-debug.apk"
          HASH_FILE="$ASSET.sha256"

          cp "$APK" "$RUNNER_TEMP/$ASSET"
          APK_SHA256="$(sha256sum "$RUNNER_TEMP/$ASSET" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "$ASSET" > "$RUNNER_TEMP/$HASH_FILE"

          NOTES="$RUNNER_TEMP/step3-release-notes.md"
          {
            echo "# Android Omni Cleaner — Step 3 parity APK"
            echo
            printf '%s\n' "- Source SHA: \`$GITHUB_SHA\`"
            printf '%s\n' "- APK SHA-256: \`$APK_SHA256\`"
            echo "- Runtime lane: AppLab v4.5 NON_TRUSTED_SMOKE PASS in this workflow"
            echo "- Purpose: physical/manual parity testing"
            echo "- Not a store release and not physical-device certified"
          } > "$NOTES"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG"               "$RUNNER_TEMP/$ASSET"               "$RUNNER_TEMP/$HASH_FILE"               --clobber               --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG"               "$RUNNER_TEMP/$ASSET"               "$RUNNER_TEMP/$HASH_FILE"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "Step 3 parity APK · $SHORT_SHA"               --notes-file "$NOTES"               --prerelease
          fi

          echo "Parity APK SHA-256: $APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag: $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Step 4 hardened APK prerelease
        if: success() && github.ref == 'refs/heads/hardening/maxi-step-4-safety-storage'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          APK="$GITHUB_WORKSPACE/target/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="step4-hardening-$SHORT_SHA"
          ASSET="Android-Omni-Cleaner-Step4-$SHORT_SHA-debug.apk"
          HASH_FILE="$ASSET.sha256"

          cp "$APK" "$RUNNER_TEMP/$ASSET"
          APK_SHA256="$(sha256sum "$RUNNER_TEMP/$ASSET" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "$ASSET" > "$RUNNER_TEMP/$HASH_FILE"

          NOTES="$RUNNER_TEMP/step4-release-notes.md"
          {
            echo "# Android Omni Cleaner — Step 4 hardened APK"
            echo
            printf '%s\n' "- Source SHA: \`$GITHUB_SHA\`"
            printf '%s\n' "- APK SHA-256: \`$APK_SHA256\`"
            echo "- Version: 0.5.0-recovery / code 5"
            echo "- Runtime lane: AppLab v4.5 NON_TRUSTED_SMOKE PASS"
            echo "- Purpose: manual/physical safety and storage testing"
            echo "- Not a store release and not physical-device certified"
          } > "$NOTES"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/$HASH_FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/$HASH_FILE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Step 4 hardened APK · $SHORT_SHA" --notes-file "$NOTES" --prerelease
          fi

          echo "Step 4 APK SHA-256: $APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag: $TAG" >> "$GITHUB_STEP_SUMMARY"


      - name: Publish Step 5 monetization APK prerelease
        if: success() && github.ref == 'refs/heads/monetization/maxi-step-5-productization-clean'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          APK="$GITHUB_WORKSPACE/target/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="step5-monetization-$SHORT_SHA"
          ASSET="Android-Omni-Cleaner-Step5-$SHORT_SHA-debug.apk"
          HASH_FILE="$ASSET.sha256"

          cp "$APK" "$RUNNER_TEMP/$ASSET"
          APK_SHA256="$(sha256sum "$RUNNER_TEMP/$ASSET" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "$ASSET" > "$RUNNER_TEMP/$HASH_FILE"

          NOTES="$RUNNER_TEMP/step5-release-notes.md"
          {
            echo "# Android Omni Cleaner — Step 5 monetization APK"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- APK SHA-256: $APK_SHA256"
            echo "- Version: 0.6.0-recovery / code 6"
            echo "- Google demo ads only"
            echo "- Billing purchase validation requires Play Internal Testing with production package/signing"
            echo "- Runtime lane: AppLab v4.5 NON_TRUSTED_SMOKE PASS"
            echo "- Not a store release"
          } > "$NOTES"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/$HASH_FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/$HASH_FILE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Step 5 monetization APK · $SHORT_SHA" --notes-file "$NOTES" --prerelease
          fi

          echo "Step 5 APK SHA-256: $APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag: $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Step 6 redesign APK prerelease
        if: success() && startsWith(github.ref, 'refs/heads/redesign/maxi-step-6-ui-ux')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          APK="$GITHUB_WORKSPACE/target/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="step6-redesign-$SHORT_SHA"
          ASSET="Android-Omni-Cleaner-Step6-$SHORT_SHA-debug.apk"
          HASH_FILE="$ASSET.sha256"

          cp "$APK" "$RUNNER_TEMP/$ASSET"
          APK_SHA256="$(sha256sum "$RUNNER_TEMP/$ASSET" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "$ASSET" > "$RUNNER_TEMP/$HASH_FILE"

          NOTES="$RUNNER_TEMP/step6-release-notes.md"
          {
            echo "# Android Omni Cleaner — Step 6 redesign APK"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- APK SHA-256: $APK_SHA256"
            echo "- Version: 0.7.0-recovery / code 7"
            echo "- Five-surface redesigned shell"
            echo "- Google demo ads only"
            echo "- Runtime lane: AppLab v4.5 NON_TRUSTED_SMOKE PASS"
            echo "- Not a store release"
          } > "$NOTES"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/$HASH_FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/$HASH_FILE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Step 6 redesign APK · $SHORT_SHA" --notes-file "$NOTES" --prerelease
          fi

          echo "Step 6 APK SHA-256: $APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag: $TAG" >> "$GITHUB_STEP_SUMMARY"


      - name: Publish Step 7 product expansion APK prerelease
        if: success() && github.ref == 'refs/heads/step-7-product-expansion'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          APK="$GITHUB_WORKSPACE/target/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="step7-product-$SHORT_SHA"
          ASSET="Android-Omni-Cleaner-Step7-$SHORT_SHA-debug.apk"
          HASH_FILE="$ASSET.sha256"

          cp "$APK" "$RUNNER_TEMP/$ASSET"
          APK_SHA256="$(sha256sum "$RUNNER_TEMP/$ASSET" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "$ASSET" > "$RUNNER_TEMP/$HASH_FILE"

          NOTES="$RUNNER_TEMP/step7-release-notes.md"
          {
            echo "# Android Omni Cleaner — Step 7 product expansion APK"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- APK SHA-256: $APK_SHA256"
            echo "- Version: 0.8.0-recovery / code 8"
            echo "- Smart Categories: old downloads, installers, archives, screenshots"
            echo "- No automatic deletion; snapshot revalidation retained"
            echo "- Google demo ads only"
            echo "- Runtime lane: AppLab v4.5 NON_TRUSTED_SMOKE PASS"
            echo "- Not a store release and not physical-device certified"
          } > "$NOTES"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/$HASH_FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/$HASH_FILE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Step 7 product expansion APK · $SHORT_SHA" --notes-file "$NOTES" --prerelease
          fi

          echo "Step 7 APK SHA-256: $APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag: $TAG" >> "$GITHUB_STEP_SUMMARY"


      - name: Publish Step 8 localization accessibility APK prerelease
        if: success() && github.ref == 'refs/heads/step-8-localization-accessibility'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          APK="$GITHUB_WORKSPACE/target/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="step8-accessibility-$SHORT_SHA"
          ASSET="Android-Omni-Cleaner-Step8-$SHORT_SHA-debug.apk"
          HASH_FILE="$ASSET.sha256"

          cp "$APK" "$RUNNER_TEMP/$ASSET"
          APK_SHA256="$(sha256sum "$RUNNER_TEMP/$ASSET" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "$ASSET" > "$RUNNER_TEMP/$HASH_FILE"

          NOTES="$RUNNER_TEMP/step8-release-notes.md"
          {
            echo "# Android Omni Cleaner — Step 8 localization & accessibility APK"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- APK SHA-256: $APK_SHA256"
            echo "- Version: 0.9.0-recovery / code 9"
            echo "- Locales: en / it / es / fr / pt with manual language selector"
            echo "- Accessibility: TalkBack selection semantics + large-font hardening"
            echo "- Runtime lane includes locale switching at 1.3x font scale"
            echo "- Runtime lane: AppLab v4.5 NON_TRUSTED_SMOKE PASS"
            echo "- Not a store release and not physical-device certified"
          } > "$NOTES"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/$HASH_FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/$HASH_FILE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Step 8 localization & accessibility APK · $SHORT_SHA" --notes-file "$NOTES" --prerelease
          fi

          echo "Step 8 APK SHA-256: $APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag: $TAG" >> "$GITHUB_STEP_SUMMARY"


      - name: Publish Step 9 performance deep-QA APK prerelease
        if: success() && github.ref == 'refs/heads/step-9-performance-deep-qa'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          APK="$GITHUB_WORKSPACE/target/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="step9-performance-$SHORT_SHA"
          ASSET="Android-Omni-Cleaner-Step9-$SHORT_SHA-debug.apk"
          HASH_FILE="$ASSET.sha256"

          cp "$APK" "$RUNNER_TEMP/$ASSET"
          APK_SHA256="$(sha256sum "$RUNNER_TEMP/$ASSET" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "$ASSET" > "$RUNNER_TEMP/$HASH_FILE"

          NOTES="$RUNNER_TEMP/step9-release-notes.md"
          {
            echo "# Android Omni Cleaner — Step 9 performance & deep QA APK"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- APK SHA-256: $APK_SHA256"
            echo "- Version: 0.10.0-recovery / code 10"
            echo "- Large-library duplicate prefilter + cancellable full verification"
            echo "- Bounded Gallery review memory + cancellable MediaStore queries"
            echo "- Reduced-I/O EXIF export with end-to-end verification retained"
            echo "- AppLab FULL: performance/lifecycle/process-death/background/storage enabled"
            echo "- Runtime dataset: deterministic 1,253-file fixture"
            echo "- Not a store release and not physical-device certified"
          } > "$NOTES"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/$HASH_FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/$HASH_FILE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Step 9 performance & deep QA APK · $SHORT_SHA" --notes-file "$NOTES" --prerelease
          fi

          echo "Step 9 APK SHA-256: $APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
