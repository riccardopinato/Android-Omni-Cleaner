# APP_FACTORY_CONTEXT_v4 — GitHub App PRs start CI; branch-only fallback without credentials; no runtime changes
name: App Factory — context snapshot
on:
  schedule:
    - cron: '11 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/app-factory-context.yml'
      - '.github/workflows/app-factory-context-automerge.yml'
permissions:
  contents: read
concurrency:
  group: app-factory-context-${{ github.repository }}
  cancel-in-progress: false
jobs:
  validate-app-factory-context:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate workflow contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('.github/workflows/app-factory-context.yml').read_text(encoding='utf-8')
          merge = Path('.github/workflows/app-factory-context-automerge.yml').read_text(encoding='utf-8')
          for marker in ('APP_FACTORY_CONTEXT_v4', 'workflow_dispatch:', 'APP_FACTORY_CONTEXT.md', 'git push origin HEAD:refs/heads/automation/app-factory-context', 'APP_FACTORY_BOT_MISSING', 'APP_FACTORY_BOT_CLIENT_ID', 'APP_FACTORY_BOT_PRIVATE_KEY', 'actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc'):
              assert marker in s, marker
          for marker in ('SNAPSHOT_AUTOMERGE_VERIFIED', 'required.issubset', 'REQUIRED_CHECKS_JSON', 'APP_FACTORY_BOT_PRIVATE_KEY', 'expected_paths'):
              assert marker in merge, marker
          # Compile the actual scheduled Python guard even on PR runs. No API
          # calls, credentials or repository mutations during validation.
          heredoc = "          python3 - <<'PY'\n"
          assert merge.count(heredoc) == 1
          script = merge.split(heredoc, 1)[1].split("\n          PY\n", 1)[0]
          assert script and all(line.startswith('          ') for line in script.splitlines())
          compile('\n'.join(line[10:] for line in script.splitlines()) + '\n',
                  'app-factory-context-automerge.py', 'exec')
          print('APP_FACTORY_CONTEXT_V4_CONTRACT_PASS')
          PY
  snapshot-app-factory-context:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Detect App Factory bot credentials
        id: bot-config
        shell: bash
        env:
          BOT_CLIENT_ID: ${{ vars.APP_FACTORY_BOT_CLIENT_ID }}
          BOT_PRIVATE_KEY: ${{ secrets.APP_FACTORY_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${BOT_CLIENT_ID}" && -n "${BOT_PRIVATE_KEY}" ]]; then
            echo 'ready=true' >> "${GITHUB_OUTPUT}"
          elif [[ -z "${BOT_CLIENT_ID}" && -z "${BOT_PRIVATE_KEY}" ]]; then
            echo 'ready=false' >> "${GITHUB_OUTPUT}"
            echo 'APP_FACTORY_BOT_NOT_CONFIGURED'
          else
            echo 'APP_FACTORY_BOT_CREDENTIALS_INCOMPLETE' >&2
            exit 1
          fi
      - name: Mint single-repository GitHub App token
        id: bot-token
        if: steps.bot-config.outputs.ready == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.APP_FACTORY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.APP_FACTORY_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token || github.token }}
      - name: Reconcile public source SHAs and propose reviewed update
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || github.token }}
          SOURCE_TOKEN: ${{ github.token }}
          BOT_READY: ${{ steps.bot-config.outputs.ready }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "${BASE_BRANCH}"
          if git ls-remote --exit-code --heads origin automation/app-factory-context >/dev/null; then
            git fetch origin automation/app-factory-context
            git switch --track -c automation/app-factory-context origin/automation/app-factory-context
            git merge --no-edit "origin/${BASE_BRANCH}"
          else
            git switch -c automation/app-factory-context "origin/${BASE_BRANCH}"
          fi
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, urllib.request
          from pathlib import Path
          sources = [["riccardopinato/App-Factory-Core","Master, Golden e policy"],["riccardopinato/Idee-app-Archivi-riferimenti","Idee, capability e donor"]]
          token = os.environ.get('SOURCE_TOKEN', '')
          rows = []
          for repo, role in sources:
              def api(path):
                  req = urllib.request.Request('https://api.github.com/repos/' + repo + path, headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'AppFactorySnapshot/1', 'Authorization': 'Bearer ' + token})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return json.load(resp)
              meta = api('')
              branch = meta['default_branch']
              head = api('/commits/' + branch)
              sha = head['sha']
              if len(sha) != 40 or any(c not in '0123456789abcdef' for c in sha): raise ValueError('Invalid SHA')
              rows.append({'repository': repo, 'purpose': role, 'branch': branch, 'sha': sha, 'commit_date': head['commit']['committer']['date']})
          rows.sort(key=lambda x: x['repository'])
          payload = {'schema': 1, 'sources': rows}
          dest = Path('docs'); dest.mkdir(exist_ok=True)
          (dest / 'APP_FACTORY_CONTEXT.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          lines = ['# App Factory — sorgenti monitorate', '', '> Snapshot metadata GitHub generato automaticamente. Non certifica implementazioni, test, APK o release.', '', '| Repository | Uso | Branch | Commit | Ultimo commit (UTC) |', '|---|---|---|---|---|']
          for x in rows:
              url = 'https://github.com/' + x['repository']
              lines.append('| [' + x['repository'] + '](' + url + ') | ' + x['purpose'] + ' | `' + x['branch'] + '` | [`' + x['sha'][:12] + '`](' + url + '/commit/' + x['sha'] + ') | ' + x['commit_date'] + ' |')
          lines.extend(['', '## Limiti', '', '- Solo SHA e timestamp di repository pubblici autorizzati; non sono importati codice, dati privati o documenti.', '- Le modifiche di Product Bible, Roadmap, Donor, Golden o sorgenti richiedono audit e PR separata.', '- Un cambiamento SHA non equivale a test o approvazione; la PR di snapshot resta soggetta ai gate.', ''])
          (dest / 'APP_FACTORY_CONTEXT.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
          git add -- docs/APP_FACTORY_CONTEXT.json docs/APP_FACTORY_CONTEXT.md
          if git diff --cached --quiet; then
            echo 'SNAPSHOT_UNCHANGED'
          else
            git commit -m 'chore(context): observe upstream factory commits'
          fi
          REMOTE_HEAD="$(git ls-remote origin refs/heads/automation/app-factory-context | awk '{print $1}')"
          if [ "$(git rev-parse HEAD)" != "$REMOTE_HEAD" ]; then
            git push origin HEAD:refs/heads/automation/app-factory-context
          fi
          if git diff --quiet "origin/${BASE_BRANCH}" HEAD -- docs/APP_FACTORY_CONTEXT.json docs/APP_FACTORY_CONTEXT.md; then
            echo 'NO_OP: no snapshot delta versus base'
            exit 0
          fi
          # A GITHUB_TOKEN-created PR does not start ordinary PR CI; never
          # silently use it for PR creation. The App token owns both git push
          # (checkout credentials) and gh pr create, triggering exact-head CI.
          PR_NUMBER="$(gh pr list --head automation/app-factory-context --state open --json number --jq '.[0].number // empty')"
          if [ -n "${PR_NUMBER}" ]; then
            echo "SNAPSHOT_PR_ALREADY_OPEN ${PR_NUMBER}"
            exit 0
          fi
          if [ "${BOT_READY}" != 'true' ]; then
            echo 'APP_FACTORY_BOT_MISSING: branch ready, PR not created, main unchanged'
            echo '::warning title=App Factory bot setup needed::Configure APP_FACTORY_BOT_CLIENT_ID (repository variable) and APP_FACTORY_BOT_PRIVATE_KEY (repository secret) to create a PR that triggers CI. Snapshot branch is ready.'
            {
              echo '### App Factory context — awaiting GitHub App credentials'
              echo ''
              echo '**State:** `BRANCH_READY_BOT_NOT_CONFIGURED`; main was not updated.'
              echo ''
              echo "Review [the snapshot comparison](https://github.com/${GH_REPO}/compare/${BASE_BRANCH}...automation/app-factory-context?expand=1)."
              echo ''
              echo 'A GitHub App token with Contents write, Pull requests write and Checks read is required to create CI-triggering PRs.'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if PR_RESULT="$(gh pr create --head automation/app-factory-context --base "${BASE_BRANCH}" --title 'chore(context): new upstream GitHub snapshot' --body 'Metadata only. Opened by scoped GitHub App so exact-head PR CI runs automatically; a separate metadata-only merge workflow requires all applicable checks PASS.' 2>&1)"; then
            printf '%s\n' "${PR_RESULT}"
            echo 'SNAPSHOT_PR_CREATED_APP_TOKEN'
          else
            printf '%s\n' "${PR_RESULT}" >&2
            echo 'SNAPSHOT_PR_UNEXPECTED_FAILURE' >&2
            exit 1
          fi
