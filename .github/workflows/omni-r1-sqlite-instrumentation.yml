name: Omni Cleaner — R1 SQLite instrumentation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/riccardopinato/omnicleaner/cleaner/PersistentStorageIndex.kt'
      - 'app/src/androidTest/java/com/riccardopinato/omnicleaner/cleaner/PersistentStorageIndexInstrumentedTest.kt'
      - 'app/src/androidTest/java/com/riccardopinato/omnicleaner/cleaner/OmniR1IndexStressInstrumentedTest.kt'
      - '.github/workflows/omni-r1-sqlite-instrumentation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMNI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: omni-r1-sqlite-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.OMNI_SOURCE_SHA }}
          persist-credentials: false

      - name: JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic

      - name: Compile debug and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute SQLite migration, cache and stress cases on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disk-size: 4096M
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.riccardopinato.omnicleaner.cleaner.PersistentStorageIndexInstrumentedTest,com.riccardopinato.omnicleaner.cleaner.OmniR1IndexStressInstrumentedTest

      - name: Verify Android actually executed both index test classes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("app/build/outputs/androidTest-results/connected")
          required = {
              "PersistentStorageIndexInstrumentedTest": 1,
              "OmniR1IndexStressInstrumentedTest": 1,
          }
          matches = {key: [] for key in required}
          for path in root.rglob("*.xml"):
              try:
                  tree = ET.parse(path)
              except ET.ParseError:
                  continue
              for case in tree.iter("testcase"):
                  classname = case.attrib.get("classname", "")
                  for key in required:
                      if key in classname:
                          matches[key].append(case)
          for key, minimum in required.items():
              tests = matches[key]
              if len(tests) < minimum:
                  raise SystemExit("FAIL: " + key + " tests not executed (" + str(len(tests)) + ")")
              for case in tests:
                  if any(case.find(t) is not None for t in ("failure", "error", "skipped")):
                      raise SystemExit("FAIL: " + key + " " + str(case.attrib))
              print("PASS: " + key + " executed " + str(len(tests)) + " tests")
          PY

      - name: Evidence boundary
        if: always()
        run: |
          {
            echo "## Omni R1 SQLite instrumentation"
            echo "- Exact source SHA: $OMNI_SOURCE_SHA"
            echo "- Fixture: 1,200 synthetic small files, 3 repeated reconciliations."
            echo "- Android API 35 emulator only. No physical speedup is asserted."
            echo "- Physical Xiaomi matched R0/R1 cold/warm timing and OEM destructive QA remain separate gates."
            echo "- The job outcome, not this summary, determines test PASS/FAIL."
          } >> "$GITHUB_STEP_SUMMARY"
