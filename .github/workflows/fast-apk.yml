name: Fast APK

on:
  push:
    branches:
      - step-9-performance-deep-qa
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/fast-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build installable debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish SHA-bound APK prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          SRC="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC"

          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="fast-apk-$SHORT_SHA"
          APK="Android-Omni-Cleaner-$SHORT_SHA-debug.apk"
          SUM="$APK.sha256"

          cp "$SRC" "$RUNNER_TEMP/$APK"
          sha256sum "$RUNNER_TEMP/$APK" | sed "s#  .*/#  #" > "$RUNNER_TEMP/$SUM"

          NOTES="$RUNNER_TEMP/fast-apk-notes.md"
          {
            echo "# Android Omni Cleaner — FAST development APK"
            echo
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Variant: debug"
            echo "- Purpose: rapid install/test build"
            echo "- QA/AppLab certification: DEFERRED"
            echo "- Store/release certification: NOT PERFORMED"
          } > "$NOTES"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG"               "$RUNNER_TEMP/$APK"               "$RUNNER_TEMP/$SUM"               --clobber               --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG"               "$RUNNER_TEMP/$APK"               "$RUNNER_TEMP/$SUM"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "FAST APK · $SHORT_SHA"               --notes-file "$NOTES"               --prerelease
          fi
