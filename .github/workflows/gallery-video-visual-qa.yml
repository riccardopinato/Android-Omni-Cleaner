name: Gallery & Video Visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/java/com/riccardopinato/omnicleaner/gallery/GalleryCleanerSection.kt"
      - "app/src/main/java/com/riccardopinato/omnicleaner/gallery/GalleryMediaPreview.kt"
      - ".maestro/gallery-video-qa.yaml"
      - ".maestro/gallery-ready.yaml"
      - ".github/scripts/prepare-gallery-qa-media.sh"
      - ".github/workflows/gallery-video-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-visual-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  media-review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMNI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PACKAGE_ID: com.riccardopinato.omnicleaner.debug

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.OMNI_SOURCE_SHA }}
          persist-credentials: false

      - name: Checkout pinned Maestro installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: riccardopinato/AppLab
          ref: 494f9b4c4a386429b2e49ce907dea87bf05e2cd3
          path: .applab
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Install pinned Maestro CLI
        run: bash .applab/scripts/install_maestro.sh

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gallery & native video emulator journey
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disk-size: 2048M
          disable-animations: true
          script: |
            set -Eeuo pipefail
            mkdir -p visual-evidence
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant "$PACKAGE_ID" android.permission.READ_MEDIA_IMAGES
            adb shell pm grant "$PACKAGE_ID" android.permission.READ_MEDIA_VIDEO
            bash .github/scripts/prepare-gallery-qa-media.sh
            maestro test --test-output-dir=visual-evidence/maestro .maestro/gallery-video-qa.yaml
            adb shell cmd uimode night yes
            maestro test --test-output-dir=visual-evidence/dark .maestro/gallery-ready.yaml
            adb exec-out screencap -p > visual-evidence/gallery-dark.png
            adb shell cmd uimode night no
            adb shell settings put system font_scale 1.3
            maestro test --test-output-dir=visual-evidence/large-font .maestro/gallery-ready.yaml
            adb exec-out screencap -p > visual-evidence/gallery-large-font.png
            adb shell settings put system font_scale 1.0
            test "$(find visual-evidence -type f -name '*.png' | wc -l)" -ge 6
            printf 'Source SHA: %s\nFixture: generated testsrc JPG portrait and H.264 MP4, never user media\n' "$OMNI_SOURCE_SHA" > visual-evidence/PROVENANCE.txt

      - name: Upload actual screen evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: omni-gallery-video-${{ env.OMNI_SOURCE_SHA }}
          path: visual-evidence/
          if-no-files-found: warn
          retention-days: 14
