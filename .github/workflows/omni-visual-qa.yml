name: Omni Visual QA Pilot

on:
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/java/com/riccardopinato/omnicleaner/ui/redesign/**"
      - "app/src/main/res/drawable/omni_*.xml"
      - ".maestro/omni-impeccable-visual.yaml"
      - ".github/workflows/omni-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omni-visual-qa-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, 'UI pilot')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMNI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.OMNI_SOURCE_SHA }}
          persist-credentials: false

      - name: Checkout pinned Maestro installer from AppLab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: riccardopinato/AppLab
          ref: 494f9b4c4a386429b2e49ce907dea87bf05e2cd3
          path: .applab
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic

      - name: Build exact-head debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Install Maestro
        run: bash .applab/scripts/install_maestro.sh

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android UI and screenshot matrix
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disk-size: 2048M
          disable-animations: true
          script: |
            set -Eeuo pipefail
            mkdir -p "$GITHUB_WORKSPACE/visual-evidence"
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk
            maestro test --test-output-dir=visual-evidence/maestro .maestro/omni-impeccable-visual.yaml
            adb shell am force-stop com.riccardopinato.omnicleaner.debug || true
            adb shell cmd uimode night yes
            adb shell am start -n com.riccardopinato.omnicleaner.debug/com.riccardopinato.omnicleaner.MainActivity
            maestro test --test-output-dir=visual-evidence/maestro-dark .maestro/omni-impeccable-home-ready.yaml
            adb exec-out screencap -p > visual-evidence/home-dark.png
            adb shell cmd uimode night no
            adb shell settings put system font_scale 1.3
            adb shell am force-stop com.riccardopinato.omnicleaner.debug
            adb shell am start -n com.riccardopinato.omnicleaner.debug/com.riccardopinato.omnicleaner.MainActivity
            maestro test --test-output-dir=visual-evidence/maestro-large-text .maestro/omni-impeccable-home-ready.yaml
            adb exec-out screencap -p > visual-evidence/home-large-text.png
            adb shell settings put system font_scale 1.0
            adb shell wm size 1080x2400
            adb shell am force-stop com.riccardopinato.omnicleaner.debug
            maestro test --test-output-dir=visual-evidence/maestro-small .maestro/omni-impeccable-home-ready.yaml
            adb exec-out screencap -p > visual-evidence/home-small-viewport.png
            adb shell wm size reset
            test "$(find visual-evidence -type f -name '*.png' | wc -l)" -ge 9
            printf 'Source SHA: %s\n' "$OMNI_SOURCE_SHA" > visual-evidence/PROVENANCE.txt

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: omni-impeccable-visual-${{ env.OMNI_SOURCE_SHA }}
          path: visual-evidence/
          if-no-files-found: warn
          retention-days: 14
