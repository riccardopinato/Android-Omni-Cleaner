name: AppLab Autonomous Review

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  review:
    uses: riccardopinato/AppLab/.github/workflows/autonomous-app-review-v31.yml@dc826264c31dd79fc7617ab7a4a8aee61f9b5aba
    with:
      target_repository: riccardopinato/Android-Omni-Cleaner
      target_ref: ${{ github.sha }}
      max_files: "3500"
      run_maestro: true
    secrets: inherit
