name: AppLab Intelligence

on:
  push:
    branches:
      - "recovery/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applab-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intelligence:
    name: Product · UX · Architecture audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: target
          fetch-depth: 1

      - name: Checkout pinned AppLab v4.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: riccardopinato/AppLab
          ref: d3681e4d2b92631ce96fcfc80349a079cbed40bb
          path: .applab
          persist-credentials: false

      - name: Run AppLab App Intelligence
        shell: bash
        run: python .applab/scripts/app_intelligence.py --repo-root "$GITHUB_WORKSPACE/target" --output-dir "$GITHUB_WORKSPACE/applab-intelligence" --max-files 3500

      - name: Publish AppLab report
        shell: bash
        run: |
          echo "===== APPLAB_REPORT_BEGIN ====="
          cat "$GITHUB_WORKSPACE/applab-intelligence/app-intelligence.md"
          echo "===== APPLAB_REPORT_END ====="
          {
            echo "## AppLab App Intelligence"
            echo
            echo "AppLab SHA: d3681e4d2b92631ce96fcfc80349a079cbed40bb"
            echo
            echo "Target: ${{ github.repository }}@${{ github.sha }}"
            echo
            cat "$GITHUB_WORKSPACE/applab-intelligence/app-intelligence.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate machine-readable report
        shell: bash
        run: python -c 'import json; report=json.load(open("applab-intelligence/app-intelligence.json", encoding="utf-8")); assert isinstance(report, dict); print("AppLab JSON report valid")'
