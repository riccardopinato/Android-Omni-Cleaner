# Opt-in source/PR review only. This does not replace AppLab or modify branch protection.
name: OpenSpec Shadow PR Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  openspec-shadow:
    name: OpenSpec Shadow (review hints; no merge/QA approval)
    uses: riccardopinato/App-Factory-Core/.github/workflows/openspec-shadow.yml@e45600bb4a12db63b3107581587e33e590d2f21b
    with:
      target_repository: riccardopinato/Android-Omni-Cleaner
      target_pr: ${{ github.event.pull_request.number || 0 }}
