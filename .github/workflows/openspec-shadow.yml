# Opt-in source/PR review only. No AppLab, merge, or branch-protection authority.
name: OpenSpec Shadow PR Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deep_pairs:
        description: "Optional 1–4 open PR pairs for pinned SHA/file review (e.g. 75:77)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  openspec-shadow:
    name: OpenSpec Shadow (review hints; no merge/QA approval)
    uses: riccardopinato/App-Factory-Core/.github/workflows/openspec-shadow.yml@2efcdfb69537c4aa472c7fd341dff12a1ec98445
    with:
      target_repository: riccardopinato/Android-Omni-Cleaner
      target_pr: ${{ github.event.pull_request.number || 0 }}
      deep_pairs: ${{ github.event_name == 'pull_request' && '75:77,39:77' || inputs.deep_pairs || '' }}
