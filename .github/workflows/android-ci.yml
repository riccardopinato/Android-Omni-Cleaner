name: Android CI

on:
  push:
    branches:
      - main
      - "recovery/**"
      - "audit/**"
      - "hardening/**"
      - "monetization/**"
      - "redesign/**"
      - "step-7-product-expansion"
      - "step-8-localization-accessibility"
      - "step-9-performance-deep-qa"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Verify locale resource parity
        run: python3 .github/scripts/check-locales.py

      - name: Static analysis, tests and builds
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease --stacktrace
