name: Android CI

on:
  push:
    branches:
      - main
      - "recovery/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic
          add-job-summary: on-failure

      - name: Bootstrap Gradle wrapper once
        id: wrapper
        shell: bash
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.6.0 --distribution-type bin
            chmod +x gradlew
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            chmod +x gradlew
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist generated wrapper
        if: github.event_name == 'push' && steps.wrapper.outputs.generated == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m "build: add Gradle wrapper 9.6"
          git push

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Static analysis, tests and builds
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease --stacktrace
