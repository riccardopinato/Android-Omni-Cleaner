name: Android CI

on:
  push:
    branches:
      - main
      # The stacked audit PR targets the design branch, so it does not
      # receive the main-only pull_request gate. Verify source HEAD on push.
      - audit/omni-safety-ux-360-20261115
      - feature/omni-storage-intelligence-v1-20261116
      - feature/omni-gallery-pro-v1-20261116
      - feature/omni-qa-gallery-review-v1-20261116
      - feature/omni-scan-engine-2-0-20261117
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  OMNI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: android-ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.OMNI_SOURCE_SHA }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Verify locale resource parity
        run: python3 .github/scripts/check-locales.py

      - name: Verify launcher icon across Android API levels
        run: python3 .github/scripts/check-launcher-icon.py

      - name: Verify blue action styles and native broom tab
        run: python3 .github/scripts/check-ux-action-style.py

      - name: Verify illustrated initial states and translations
        run: python3 .github/scripts/check-welcome-ui.py

      - name: Verify two-level navigation and original media playback
        run: python3 .github/scripts/check-two-level-media.py

      - name: Validate P1 restart/recovery QA contract
        shell: bash
        run: |
          bash -n .github/scripts/applab-runtime-smoke.sh
          python3 -m json.tool .maestro/applab-persistence.json >/dev/null
          python3 -m json.tool .maestro/applab-storage.json >/dev/null
          grep -Fq 'restart-recovery.yaml' .github/scripts/applab-runtime-smoke.sh
          grep -Fq 'omni_bento_v2_review' .maestro/restart-recovery.yaml

      - name: Verify read-only Storage Intelligence contract
        run: python3 .github/scripts/check-storage-intelligence.py

      - name: Verify read-only Gallery Pro contract
        run: python3 .github/scripts/check-gallery-pro.py

      - name: Verify cross-module review and photo comparison
        run: python3 .github/scripts/check-review-center.py

      - name: Parse Windows signing bootstrap
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "tools/bootstrap-release-signing.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Verify feature source, release code and instrumentation APK
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/omni-scan-engine-2-0-20261117'
        run: ./gradlew lintDebug lintRelease testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease --stacktrace

      - name: Show exact failing JVM assertions
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
              try:
                  root = ET.parse(path).getroot()
                  for case in root.iter("testcase"):
                      for failure in case.findall("failure"):
                          print(f"FAIL {case.get('classname')}::{case.get('name')}")
                          print(failure.get("message", ""))
                          print((failure.text or "")[:4000])
              except Exception as error:
                  print(f"Could not parse {path}: {error}")
          PY

      - name: Full main/manual verification
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/feature/omni-scan-engine-2-0-20261117'
        run: ./gradlew lintDebug lintRelease testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease --stacktrace

      - name: Publish exact-head development APK
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && (github.ref == 'refs/heads/audit/omni-safety-ux-360-20261115' || github.ref == 'refs/heads/feature/omni-storage-intelligence-v1-20261116' || github.ref == 'refs/heads/feature/omni-gallery-pro-v1-20261116' || github.ref == 'refs/heads/feature/omni-qa-gallery-review-v1-20261116' || github.ref == 'refs/heads/feature/omni-scan-engine-2-0-20261117'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC"
          SHORT_SHA="${OMNI_SOURCE_SHA:0:12}"
          TAG="fast-apk-$SHORT_SHA"
          APK="Android-Omni-Cleaner-$SHORT_SHA-debug.apk"
          SUM="$APK.sha256"
          cp "$SRC" "$RUNNER_TEMP/$APK"
          sha256sum "$RUNNER_TEMP/$APK" | sed "s#  .*/#  #" > "$RUNNER_TEMP/$SUM"
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "# Android Omni Cleaner — development APK"
            echo
            echo "- Source SHA: $OMNI_SOURCE_SHA"
            echo "- Variant: debug"
            echo "- Automatic PR verification: unit tests + debug APK + androidTest APK compilation"
            echo "- AppLab / Store certification: deferred"
          } > "$NOTES"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$APK" "$RUNNER_TEMP/$SUM" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$RUNNER_TEMP/$APK" "$RUNNER_TEMP/$SUM"               --repo "$GITHUB_REPOSITORY" --target "$OMNI_SOURCE_SHA"               --title "Development APK · $SHORT_SHA" --notes-file "$NOTES" --prerelease
          fi
